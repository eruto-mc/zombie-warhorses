buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}

plugins {
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

version = '1.0'
group = 'net.erutobusiness'
base { archivesName = 'zombie_warhorses' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'zwh.screenshot', 'true'
            args '--quickPlaySingleplayer', 'zwh'
            mods {
                zombie_warhorses {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                zombie_warhorses {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'zombie_warhorses.refmap.json'
    config 'zombie_warhorses.mixins.json'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // PFMStoneVariantMixin のターゲット解決用（実行時は同梱せず・コンパイル/mixin検証のみ）
    compileOnly files('libs/pfm.jar')
    // RoadArchitectNoBlockingScanMixin のターゲット解決用（実行時は同梱せず・コンパイル/mixin検証のみ）
    compileOnly files('libs/roadarchitect.jar')
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'zombie_warhorses',
            'Specification-Version' : '1',
            'Implementation-Title'  : 'Zombie Warhorses',
            'Implementation-Version': project.version,
            'MixinConfigs'          : 'zombie_warhorses.mixins.json'
        ])
    }
}
